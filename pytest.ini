[tool:pytest]
# Basic configuration
minversion = 6.0
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*

# Output configuration
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=80
    --maxfail=3
    # Parallel execution - use all available CPU cores
    -n auto
    # Distributed testing for different services
    --dist=worksteal
    # Performance optimization
    --durations=10

# Markers for selective testing
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    nphies: marks tests as NPHIES insurance system tests
    auth: marks tests as authentication tests
    claims: marks tests as insurance claims tests
    compliance: marks tests as healthcare compliance tests
    performance: marks tests as performance benchmarks
    api: marks tests as API endpoint tests
    database: marks tests that require database setup

# Test discovery
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    node_modules
    __pycache__

# Timeout configuration for healthcare operations
timeout = 300
timeout_method = thread

# Parallel execution configuration
# Use pytest-xdist for parallel execution
# -n auto: automatically determine number of workers based on CPU cores
# --dist=worksteal: distribute tests dynamically for better load balancing

# Healthcare-specific configuration
# Insurance claim processing tests should complete within 30 seconds
# NPHIES integration tests may take longer due to external API calls

# Coverage exclusions
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */migrations/*
    */settings/*
    */config/*
    setup.py
    manage.py